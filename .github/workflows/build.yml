name: Build APK

# Every push to main builds a signed APK and publishes it as a new release, Ony-<version>.apk.
# The README links to docs/download (GitHub Pages), which starts the newest one downloading.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Decode signing key
        env:
          ONY_KEYSTORE_BASE64: ${{ secrets.ONY_KEYSTORE_BASE64 }}
        run: |
          # Same key every build, so new versions install over old ones.
          if [ -z "$ONY_KEYSTORE_BASE64" ]; then echo "::error::Signing secrets are missing"; exit 1; fi
          echo "$ONY_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ony-release.jks"

      - name: Build signed APK
        env:
          ONY_BUILD: ${{ github.run_number }}
          ONY_KEYSTORE_PATH: ${{ runner.temp }}/ony-release.jks
          ONY_KEYSTORE_PASSWORD: ${{ secrets.ONY_KEYSTORE_PASSWORD }}
          ONY_KEY_ALIAS: ${{ secrets.ONY_KEY_ALIAS }}
          ONY_KEY_PASSWORD: ${{ secrets.ONY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "Ony-$VERSION.apk"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" "Ony-$VERSION.apk" \
            --title "Ony $VERSION" \
            --notes "Built automatically from commit ${GITHUB_SHA::7}. Download Ony-$VERSION.apk below and open it on your phone." \
            --latest
